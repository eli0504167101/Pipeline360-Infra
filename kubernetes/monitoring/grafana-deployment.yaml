apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
              secretKeyRef:
              name: grafana-admin-secret
              key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
              secretKeyRef:
              name: grafana-admin-secret
              key: admin-password
              
          volumeMounts:
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources

      volumes:
        - name: grafana-datasource
          configMap:
            name: grafana-datasource