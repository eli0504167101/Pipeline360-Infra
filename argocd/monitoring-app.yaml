apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pipeline360-monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/eli0504167101/Pipeline360-Infra.git
    targetRevision: main
    path: kubernetes/monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true